name: Ingest URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL inicial para ingerir (ex: https://help.autodesk.com/view/RVT/2025/PTB/)'
        required: true
      name:
        description: 'Nome da fonte (ex: Revit 2025 - Ajuda Oficial)'
        required: true
      depth:
        description: 'Profundidade de crawling: 0=só a URL, 1=links diretos, 2=dois níveis'
        required: false
        default: '1'
      max_pages:
        description: 'Máximo de páginas a coletar'
        required: false
        default: '80'
      delay:
        description: 'Delay em segundos entre requisições (respeita o servidor)'
        required: false
        default: '1.5'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Ingest URL
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python ingest/process_url.py \
            --url "${{ github.event.inputs.url }}" \
            --name "${{ github.event.inputs.name }}" \
            --depth "${{ github.event.inputs.depth }}" \
            --max-pages "${{ github.event.inputs.max_pages }}" \
            --delay "${{ github.event.inputs.delay }}"
